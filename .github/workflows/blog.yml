name: Regenera l'índex del blog

on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "tools/build_blog.py"

permissions:
  contents: write

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenera index.html
        run: python3 tools/build_blog.py

      - name: Desa els canvis si n'hi ha
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html ja està al dia"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Regenera l'índex del blog [skip ci]"
          git push
